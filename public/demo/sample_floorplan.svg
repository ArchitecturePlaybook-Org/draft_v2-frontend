<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#f8fafc; font-family: -apple-system, system-ui, sans-serif;">
  <defs>
    <!-- Hatch pattern for walls -->
    <pattern id="wall-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#334155" stroke-width="2" />
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Blueprint Background Grid -->
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Outer Boundary Walls (230mm) -->
  <rect x="150" y="100" width="900" height="550" fill="none" stroke="#1e293b" stroke-width="16" rx="2" />

  <!-- Internal Partition Walls (115mm) -->
  <!-- Master Bed Wall -->
  <line x1="150" y1="380" x2="600" y2="380" stroke="#1e293b" stroke-width="10" />
  <!-- Living / Dining Divider -->
  <line x1="600" y1="100" x2="600" y2="650" stroke="#1e293b" stroke-width="12" />
  <!-- Kitchen Wall -->
  <line x1="600" y1="350" x2="1050" y2="350" stroke="#1e293b" stroke-width="10" />
  <!-- Toilet Wall -->
  <line x1="420" y1="380" x2="420" y2="650" stroke="#1e293b" stroke-width="8" />

  <!-- Doors (Arcs & Openings) -->
  <!-- Main Entrance Door -->
  <rect x="720" y="92" width="60" height="16" fill="#f8fafc" />
  <path d="M 720 100 A 60 60 0 0 1 780 160" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="3 3" />
  <line x1="720" y1="100" x2="720" y2="160" stroke="#0284c7" stroke-width="2.5" />

  <!-- Master Bed Door -->
  <rect x="530" y="372" width="50" height="16" fill="#f8fafc" />
  <path d="M 530 380 A 50 50 0 0 0 580 330" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Windows -->
  <rect x="250" y="92" width="120" height="16" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
  <rect x="850" y="92" width="100" height="16" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
  <rect x="1042" y="420" width="16" height="120" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
  <rect x="250" y="642" width="120" height="16" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />

  <!-- Room Labels & Dimensions -->
  <!-- Master Bedroom -->
  <g transform="translate(360, 240)">
    <text x="0" y="0" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle">MASTER BEDROOM</text>
    <text x="0" y="20" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">4.50m × 3.50m (15.75 m²)</text>
  </g>

  <!-- Living Room -->
  <g transform="translate(820, 220)">
    <text x="0" y="0" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle">LIVING &amp; DINING</text>
    <text x="0" y="20" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">5.60m × 3.10m (17.36 m²)</text>
  </g>

  <!-- Kitchen -->
  <g transform="translate(820, 500)">
    <text x="0" y="0" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle">MODULAR KITCHEN</text>
    <text x="0" y="20" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">4.50m × 3.00m (13.50 m²)</text>
  </g>

  <!-- Attached Bath -->
  <g transform="translate(280, 510)">
    <text x="0" y="0" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">BATH / WC</text>
    <text x="0" y="18" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">2.70m × 1.80m</text>
  </g>

  <!-- Balcony -->
  <g transform="translate(510, 510)">
    <text x="0" y="0" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">UTILITY</text>
    <text x="0" y="18" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">1.80m × 2.70m</text>
  </g>

  <!-- Reference Dimension Scale Bar (Calibration Guide) -->
  <g transform="translate(150, 710)">
    <!-- 5 Meter Scale Bar -->
    <line x1="0" y1="0" x2="200" y2="0" stroke="#0f172a" stroke-width="3" />
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#0f172a" stroke-width="3" />
    <line x1="200" y1="-8" x2="200" y2="8" stroke="#0f172a" stroke-width="3" />
    <text x="100" y="-12" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle">CALIBRATION SCALE BAR: 5.00 m (200 px)</text>
    <text x="100" y="20" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">1 pixel = 0.025 m (1 meter = 40 px)</text>
  </g>

  <!-- North Symbol -->
  <g transform="translate(1000, 720)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#64748b" stroke-width="1.5" />
    <polygon points="0,-18 5,-2 0,-5 -5,-2" fill="#ef4444" />
    <polygon points="0,18 5,2 0,5 -5,2" fill="#64748b" />
    <text x="0" y="-24" font-size="12" font-weight="900" fill="#ef4444" text-anchor="middle">N</text>
  </g>
</svg>
